name: Publish Python Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  issues: write
  pull-requests: write
  
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.x'

    # 👇 【修复关键：安装本地方包，让 setuptools 能读到 __version__】
    - name: Install local package for version detection
      run: pip install -e .

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    # 👇 【调试：打印当前版本，确认是否读到最新】
    - name: Show detected version
      run: |
        python -c "from pyosis import __version__; print('✅ 当前版本:', __version__)"

    - name: Build package
      run: python -m build

    - name: List built files
      run: ls -la dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'release'
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz