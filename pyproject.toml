[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# PyPI 上的包名
name = "osis-python"
# 版本号
dynamic = ["version"]
# 作者信息
authors = [
    {name = "CCCC Highway Consultant Co. Ltd.", email = "support@osisbim.com"},
]
# 描述
description = "A Python client library for Osis APDL"
# 详细描述文件
readme = "README.md"
# 许可证文件
license = "MIT"
license-files = ["LICENSE"]
# Python 版本要求
requires-python = ">=3.11"
# 分类器
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# 依赖，pyosis并不直接依赖，OSIS助手依赖这些
dependencies = [
    "openai">=2.7.1,
    "agentscope">=1.0.13,
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "langchain-community">=0.4.1,
    "matplotlib">=3.10.7,
    "pandas">=2.3.3,
    "pdfplumber">=0.11.9,
    "python-docx">=1.2.0,
    "requests">=2.32.5,
    "uvicorn">=0.40.0,
]

[tool.setuptools.dynamic]
version = {attr = "pyosis.__version__"}

# 项目链接
[project.urls]
Homepage = "https://github.com/osis-ai/pyosis"
Documentation = "https://github.com/osis-ai/pyosis#readme"
Repository = "https://github.com/osis-ai/pyosis.git"
BugTracker = "https://github.com/osis-ai/pyosis/issues"

# 可选依赖
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

# 包发现配置
[tool.setuptools.packages.find]
where = ["src"]

# 包含的包数据
[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.json"]